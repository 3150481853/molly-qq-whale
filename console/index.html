    <strong class="drawer-title">日志</strong>
    <select class="input input-sm" id="logSource">
      <option value="watchdog">watchdog</option>
      <option value="plugin">plugin</option>
      <option value="snowluma-boot">SnowLuma 启动</option>
      <option value="snowluma-runtime">SnowLuma 运行</option>
    </select>
    <span class="drawer-path mono" id="logPath"></span>
    <button class="btn btn-ghost btn-sm" id="logReload" type="button">刷新</button>
    <button class="btn btn-ghost btn-sm" id="logClose" type="button">收起</button>
  </div>
  <pre class="log-body mono" id="logBody">（尚未加载）</pre>
</aside>

<!-- 通用 CRUD 弹层：记忆新�?编辑/删除、表情包上传/改关键词/删除共用 -->
<div class="modal" id="crudModal" hidden role="dialog" aria-modal="true" aria-labelledby="crudTitle">
  <div class="modal-card crud-card">
    <div class="crud-head">
      <h2 class="card-title" id="crudTitle">编辑</h2>
      <button class="btn btn-ghost btn-sm" id="crudClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="crud-body" id="crudBody"></div>
    <p class="crud-error" id="crudError" hidden></p>
    <div class="crud-foot">
      <span class="crud-hint" id="crudHint"></span>
      <button class="btn btn-ghost" id="crudCancel" type="button">取消</button>
      <button class="btn btn-primary" id="crudOk" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 表情大图预览 -->
<div class="modal" id="stkModal" hidden>
  <div class="modal-card">
    <img class="modal-img" id="stkModalImg" alt="">
    <div class="modal-foot">
      <span class="mono modal-name" id="stkModalName"></span>
      <button class="btn btn-ghost btn-sm" id="stkModalClose" type="button">关闭</button>
    </div>
  </div>
</div>

<!-- 页内确认弹层：停/重启 Molly、切模型这类动作只在这里点一次确认，不做输入框二次保�?-->
<div class="modal" id="confirmSheet" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal-card confirm-card">
    <h2 class="card-title" id="confirmTitle">确认</h2>
    <div class="confirm-body" id="confirmBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="confirmCancel" type="button">取消</button>
      <button class="btn btn-danger" id="confirmOk" type="button">确认执行</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
